[project]
name = "qsim-visit"
version = "0.1.0"
description = "Manim animations of atom interferometry, AION and gravitational-wave sources, and the qsim_visit talk built from them"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "manim>=0.21.0",
    "manim-slides[pyside6]>=5.7.0",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aionanim"
